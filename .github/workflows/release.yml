name: LOPE Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, notarize, and publish macOS app
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vX.Y.Z (received: $GITHUB_REF_NAME)." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo 'Release tags must point to a commit reachable from main.' >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_ARCHIVE=dist/LOPE-${version}-macos-arm64.zip" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/lope-developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/lope-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | awk -F'"' '/Developer ID Application:/ {print $2; exit}')"
          if [[ -z "$signing_identity" ]]; then
            echo 'No Developer ID Application identity was found after importing the certificate.' >&2
            exit 1
          fi

          {
            echo "SIGNING_IDENTITY=$signing_identity"
            echo "SIGNING_KEYCHAIN=$keychain_path"
          } >> "$GITHUB_ENV"

      - name: Build signed app bundle
        run: |
          set -euo pipefail
          make clean
          make app \
            SIGNING_IDENTITY="$SIGNING_IDENTITY" \
            APP_VERSION="$APP_VERSION" \
            APP_BUILD="$GITHUB_RUN_NUMBER" \
            CODESIGN_EXTRA_FLAGS='--timestamp'
          codesign --verify --deep --strict --verbose=2 outputs/LOPE.app

      - name: Submit app for notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          notarization_archive="$RUNNER_TEMP/LOPE-${APP_VERSION}-notarization.zip"
          ditto -c -k --keepParent outputs/LOPE.app "$notarization_archive"
          xcrun notarytool submit "$notarization_archive" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple and validate notarization
        run: |
          set -euo pipefail
          xcrun stapler staple outputs/LOPE.app
          xcrun stapler validate outputs/LOPE.app
          spctl --assess --type execute --verbose=4 outputs/LOPE.app

      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --keepParent outputs/LOPE.app "$APP_ARCHIVE"
          shasum -a 256 "$APP_ARCHIVE" > "${APP_ARCHIVE}.sha256"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$APP_ARCHIVE" "${APP_ARCHIVE}.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$APP_ARCHIVE" "${APP_ARCHIVE}.sha256" \
              --title "LOPE $APP_VERSION" \
              --generate-notes
          fi

      - name: Remove signing keychain
        if: ${{ always() }}
        run: |
          set +e
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/lope-developer-id-application.p12"
