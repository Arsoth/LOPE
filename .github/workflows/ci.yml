name: LOPE CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Format, test, and coverage gate
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Apple toolchain
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --find swift-format
          xcrun swift-format --version
          xcrun swift --version

      - name: Check formatting
        run: make lint

      - name: Run unit and self-tests
        run: make test

      - name: Enforce coverage minimums
        run: make coverage-check
